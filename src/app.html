<!-- App Container -->
<div class="min-h-screen flex flex-col bg-neutral-100 font-sans text-neutral-800 antialiased">
  
  <!-- Navbar -->
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-8 py-4 flex flex-wrap items-center justify-between gap-4">
      <a href="#" class="text-2xl font-bold text-neutral-900 tracking-tight">Township Thengisa</a>
      
      <nav class="flex items-center gap-6 font-medium text-neutral-700">
        <a href="#" class="hover:text-blue-600 transition-colors">Home</a>
        <a href="#" class="hover:text-blue-600 transition-colors">Cart</a>
        <a href="#" class="hover:text-blue-600 transition-colors">My Orders</a>
        <a href="#" class="hover:text-blue-600 transition-colors">My Account</a>
      </nav>

      <div class="flex items-center gap-3">
        <button class="px-5 py-2 text-sm font-semibold text-white bg-neutral-600 rounded-md hover:bg-neutral-700 active:translate-y-0 -translate-y-0.5 transition">Login</button>
        <button class="px-5 py-2 text-sm font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 active:translate-y-0 -translate-y-0.5 transition">Signup</button>
      </div>
    </div>
  </header>

  <!-- Main Page Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-8 pt-4 pb-8">
    
    <!-- Hero / Welcome Section -->
    <section class="text-center py-6 max-w-3xl mx-auto">
      <h1 class="text-4xl font-extrabold text-neutral-900 tracking-tight mb-2">
        Welcome to Township Thengisa
      </h1>
      <p class="text-lg text-neutral-500">
        Discover amazing local products at great prices
      </p>
    </section>

    <!-- Special Offer Carousel Banner -->
    <div class="my-4 flex flex-col items-center">
      <div class="relative w-full bg-slate-900 text-white rounded-xl p-6 shadow-xl overflow-hidden cursor-pointer hover:-translate-y-1 transition-all duration-300">
        
        <!-- Red Special Offer Badge -->
        <span class="absolute top-4 right-4 bg-red-600 text-white text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full shadow-md">
          Special Offer
        </span>

        <!-- Banner Body -->
        <div class="flex items-center gap-6">
          <img src="/path-to-picachu.jpg" alt="USB-C Hub" class="w-24 h-24 object-cover rounded-lg shadow-md" />
          
          <div class="flex flex-col">
            <h3 class="text-xl font-bold tracking-wide mb-1">USB-C Hub</h3>
            <div class="flex items-center gap-2 mb-2 font-semibold">
              <span class="line-through text-neutral-400 text-sm">R549.00</span>
              <span class="text-emerald-400 text-lg">R399.00</span>
            </div>
            <a href="#" class="text-sm font-medium text-blue-400 hover:text-blue-300 transition-colors">
              Shop Now &rarr;
            </a>
          </div>
        </div>
      </div>

      <!-- Carousel Pagination Dots -->
      <div class="flex gap-2 mt-3">
        <span class="w-2 h-2 rounded-full bg-neutral-300"></span>
        <span class="w-2 h-2 rounded-full bg-neutral-300"></span>
        <span class="w-5 h-2 rounded-full bg-emerald-500 transition-all"></span>
        <span class="w-2 h-2 rounded-full bg-neutral-300"></span>
      </div>
    </div>

    <!-- Category Sidebar + Product Grid Layout -->
    <div class="flex gap-8 mt-6 items-start">
      <!-- Sidebar -->
      <aside class="w-60 shrink-0 bg-white rounded-lg p-5 border border-neutral-200">
        <h2 class="text-lg font-bold text-neutral-900 border-b-2 border-neutral-100 pb-2 mb-4">Categories</h2>
        <ul class="flex flex-col gap-2">
          <li>
            <button class="w-full text-left bg-blue-600 text-white font-semibold px-3 py-2.5 rounded-md text-sm">All Products</button>
          </li>
          <li>
            <button class="w-full text-left text-neutral-700 hover:bg-neutral-100 px-3 py-2.5 rounded-md text-sm transition-colors">Groceries & Food</button>
          </li>
        </ul>
      </aside>

      <!-- Catalog Main View -->
      <section class="flex-1">
        <h2 class="text-3xl font-extrabold text-neutral-900 mb-6">All Products</h2>
        <!-- Product Grid goes here -->
      </section>
    </div>

  </main>
</div>
